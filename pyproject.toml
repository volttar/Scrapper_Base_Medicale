[project]
name = "scrapper-base-medicale"
version = "0.1.0"
description = "Scrapper medical multi-sources (ANSM, HAS, Theriaque, DrugBank, Vidal, etc.)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Your Name" }
]

dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.2.2",
  "tenacity>=8.3.0",
  "pydantic>=2.7.0",
]

[project.scripts]
scrapper-med = "scrapper_base.cli:main"

[tool.ruff]
line-length = 100

